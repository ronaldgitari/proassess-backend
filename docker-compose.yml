#version: "3.9"

services:

  # ── PostgreSQL ─────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: proassess-postgres
    environment:
      POSTGRES_USER: proassess
      POSTGRES_PASSWORD: proassess
      POSTGRES_DB: proassess
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proassess"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: proassess-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ── Chroma Vector Store ────────────────────────────────────────
  chroma:
    image: chromadb/chroma:0.5.20
    container_name: proassess-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "False"

  # ── MinIO Object Storage ───────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: proassess-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  # ── FastAPI Application ────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proassess-api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://proassess:proassess@postgres:5432/proassess
      DATABASE_URL_SYNC: postgresql://proassess:proassess@postgres:5432/proassess
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      chroma:
        condition: service_started
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  minio_data:
